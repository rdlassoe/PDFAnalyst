name: pdfanalyst

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  STORAGE_DIR: /data/storage
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence-transformers}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
  EMBEDDING_QUERY_PREFIX: "${EMBEDDING_QUERY_PREFIX:-query: }"
  EMBEDDING_PASSAGE_PREFIX: "${EMBEDDING_PASSAGE_PREFIX:-passage: }"
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  # Proveedor 'openai-compatible' (Groq, Gemini, OpenAI, LM Studio, llama.cpp, vLLM...). Ver README §Proveedor de generación.
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_ALLOW_EXTERNAL: ${LLM_ALLOW_EXTERNAL:-false}
  # Clave maestra para cifrar las claves API guardadas desde Ajustes (si se omite se usa /data/secret.key)
  APP_SECRET_KEY: ${APP_SECRET_KEY:-}
  OCR_ENABLED: ${OCR_ENABLED:-true}
  OCR_LANGS: ${OCR_LANGS:-spa+eng}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  # Parámetros ajustables (los valores por defecto coinciden con backend/app/config.py). Ver docs/OPERATIONS.md §10.
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
  MEDIA_MAX_IMAGE_MB: ${MEDIA_MAX_IMAGE_MB:-20}
  MEDIA_MAX_PIXELS: ${MEDIA_MAX_PIXELS:-40000000}
  MEDIA_THUMB_PX: ${MEDIA_THUMB_PX:-320}
  VISION_MAX_SIDE: ${VISION_MAX_SIDE:-1568}
  VISION_MAX_TOKENS: ${VISION_MAX_TOKENS:-500}
  VISION_RETRIES: ${VISION_RETRIES:-3}
  PDF_FIGURES_ENABLED: ${PDF_FIGURES_ENABLED:-true}
  PDF_FIGURES_MAX: ${PDF_FIGURES_MAX:-60}
  PDF_FIGURE_MIN_PX: ${PDF_FIGURE_MIN_PX:-100}
  PDF_FIGURE_MIN_AREA: ${PDF_FIGURE_MIN_AREA:-0.02}
  PDF_FIGURE_REPEAT_PAGES: ${PDF_FIGURE_REPEAT_PAGES:-3}
  PDF_VECTOR_MIN_PATHS: ${PDF_VECTOR_MIN_PATHS:-40}
  PDF_VECTOR_MIN_AREA: ${PDF_VECTOR_MIN_AREA:-0.15}
  VISION_ANSWER_MAX_IMAGES: ${VISION_ANSWER_MAX_IMAGES:-3}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
  EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
  EMBEDDING_ALLOW_EXTERNAL: ${EMBEDDING_ALLOW_EXTERNAL:-false}
  EMBEDDING_TIMEOUT_S: ${EMBEDDING_TIMEOUT_S:-120}
  OCR_MIN_CHARS: ${OCR_MIN_CHARS:-30}
  OCR_DPI: ${OCR_DPI:-200}
  CHUNK_TARGET_CHARS: ${CHUNK_TARGET_CHARS:-1200}
  CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS:-200}
  RETRIEVAL_CANDIDATES: ${RETRIEVAL_CANDIDATES:-30}
  RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-6}
  RETRIEVAL_MIN_SIMILARITY: ${RETRIEVAL_MIN_SIMILARITY:-0.80}
  RETRIEVAL_FTS_MIN_COVERAGE: ${RETRIEVAL_FTS_MIN_COVERAGE:-0.5}
  RETRIEVAL_COMMON_TERM_RATIO: ${RETRIEVAL_COMMON_TERM_RATIO:-0.10}
  RRF_K: ${RRF_K:-60}
  HYBRID_ENABLED: ${HYBRID_ENABLED:-true}
  LLM_DISABLE_THINKING: ${LLM_DISABLE_THINKING:-true}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-700}
  LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-180}
  CONTEXT_MAX_TOKENS: ${CONTEXT_MAX_TOKENS:-3500}
  JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
  HF_HOME: /data/models

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432" # solo loopback: no expuesto a la red
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # OPCIONAL (perfil 'ollama'): Ollama autocontenido. Por defecto se usa el Ollama del host (host.docker.internal).
  #   docker compose --profile ollama up -d   y   OLLAMA_BASE_URL=http://ollama:11434
  # GPU NVIDIA: añada -f docker-compose.gpu.yml. Para reutilizar modelos del host: OLLAMA_MODELS_SOURCE en .env.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434" # solo loopback; 11434 queda libre por si hay un Ollama en el host
    volumes:
      - ${OLLAMA_MODELS_SOURCE:-ollamadata}:/root/.ollama/models${OLLAMA_MODELS_MODE:-}

  # Servicio LOCAL de embeddings (por defecto EmbeddingGemma 2, solo texto, en CPU). Un único proceso con el modelo: la API y el worker lo usan por HTTP
  # (perfil «EmbeddingGemma 2 (local)» en Ajustes → Modelo de embeddings). El modelo se carga en la primera petición; no sale texto del equipo.
  # Descarga previa del modelo (≈1,5 GB): docker compose run --rm embedder python -m app.embedding_server --download
  embedder:
    build: ./backend
    command: ["python", "-m", "app.embedding_server"]
    restart: unless-stopped
    environment:
      HF_HOME: /data/models
      EMBED_SERVER_MODEL: ${EMBED_SERVER_MODEL:-google/embeddinggemma-2}
      EMBED_SERVER_TEXT_ONLY: ${EMBED_SERVER_TEXT_ONLY:-true}
      EMBED_SERVER_DTYPE: ${EMBED_SERVER_DTYPE:-float32}
      EMBED_SERVER_DEVICE: cpu
      EMBED_SERVER_MAX_SEQ_LENGTH: ${EMBED_SERVER_MAX_SEQ_LENGTH:-2048}
      EMBED_SERVER_PRELOAD: ${EMBED_SERVER_PRELOAD:-false}
      EMBED_SERVER_THREADS: ${EMBED_SERVER_THREADS:-0}
      # Medios (imagen/audio/vídeo): el servicio lee archivos de esta raíz (nunca fuera) y carga los codificadores solo mientras hacen falta
      EMBED_SERVER_MEDIA_ROOT: /data/storage
      EMBED_SERVER_MEDIA_IDLE_S: ${EMBED_SERVER_MEDIA_IDLE_S:-300}
      EMBED_SERVER_IMAGE_TOKENS: ${EMBED_SERVER_IMAGE_TOKENS:-280}
      EMBED_SERVER_VIDEO_TOKENS: ${EMBED_SERVER_VIDEO_TOKENS:-140}
      EMBED_SERVER_MEDIA_MAX_AUDIO_S: ${EMBED_SERVER_MEDIA_MAX_AUDIO_S:-300}
    volumes:
      - appdata:/data
    # Solo texto ≈2,0 GB (medido en fp32 con carga); texto+imagen ≈3,0 GB; texto+audio ≈3,7 GB (la memoria extra solo se usa mientras se indexan medios)
    mem_limit: ${EMBED_SERVER_MEM_LIMIT:-4608m}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - appdata:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes:
      - appdata:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  # Pruebas: docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build:
      context: ./backend
      args:
        WITH_DEV: "true"
    working_dir: /app
    command: ["python", "-m", "pytest"]
    environment:
      <<: *backend-env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./backend:/app # el código se monta: no hace falta reconstruir al editar
      - appdata:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
  ollamadata:
